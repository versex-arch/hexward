<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hexward</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#0a0a0b; --side:#0d0d0f; --card:#111113; --card2:#161619; --line:#1f1f24; --line2:#2a2a31;
  --fg:#ededef; --muted:#8b8b93; --dim:#5c5c66;
  --accent:#34d399; --accent-ink:#04130c; --accent-soft:rgba(52,211,153,.12);
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --crit:#f87171; --high:#fb923c; --med:#fbbf24; --low:#60a5fa; --info:#8b8b93;
  --r:14px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;
  font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI Variable","Inter",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(55% 38% at 72% -8%,rgba(52,211,153,.07),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.shell{position:relative;height:100%;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px;font:600 16px/1 "Segoe UI Variable Display","Inter",system-ui,sans-serif;letter-spacing:-.01em}
.brand .mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.nav button:hover{background:var(--card2);color:var(--fg)}
.nav button.sel{background:var(--card2);color:var(--fg)}
.nav button.sel svg{color:var(--accent)}
.badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:99px;background:var(--line2);color:var(--fg);font-size:11.5px;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
.badge.hot{background:rgba(248,113,113,.18);color:var(--bad)}
.side .grow{flex:1}
.gstat{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.gstat.on{color:var(--fg)} .gstat.on .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
.ver{color:var(--dim);font-size:12px;padding:10px 10px 0}

.main{min-width:0;display:flex;flex-direction:column;height:100%}
.head{padding:26px 34px 6px}
.head h1{font:600 24px/1.2 "Segoe UI Variable Display","Inter",system-ui,sans-serif;letter-spacing:-.02em}
.head p{color:var(--muted);margin-top:4px}
.body{flex:1;min-height:0;overflow:auto;padding:18px 34px 30px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.page{max-width:1120px;display:flex;flex-direction:column;gap:14px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.status{display:flex;align-items:center;gap:26px;padding:26px}
.ring{position:relative;flex:none;width:148px;height:148px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .arc{stroke:var(--st,var(--dim));stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease),stroke .4s}
.ring.busy svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(270deg)}}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{display:block;font:600 40px/1 "Segoe UI Variable Display","Inter",system-ui,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring span{display:block;color:var(--muted);font-size:11px;margin-top:5px;letter-spacing:.07em;text-transform:uppercase}
.status h2{font:600 22px/1.2 "Segoe UI Variable Display","Inter",system-ui,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.status h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--st,var(--dim))}
.status p{color:var(--muted);margin:6px 0 16px;max-width:40ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--line2);color:var(--dim);cursor:default;filter:none;transform:none}
.btn.sec{background:var(--card2);color:var(--fg);border:1px solid var(--line2);font-weight:500}
.btn.sec:hover{border-color:var(--dim);filter:none}
.btn.danger{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.25);font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat b{display:block;font:600 24px/1.1 "Segoe UI Variable Display","Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;margin-top:3px}
.stat span::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo .card{padding:6px 0}
.duo h3{font-size:14px;font-weight:600;padding:10px 16px 8px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;transition:background .15s}
button.prow:hover{background:var(--card2)}
.prow .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .lbl small{color:var(--dim);margin-left:8px}
.state{font-size:12.5px;padding:1px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.state.good{color:var(--ok);border-color:rgba(52,211,153,.3);background:var(--accent-soft)}
.state.bad{color:var(--bad);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.arow{display:flex;align-items:center;gap:10px;padding:9px 16px}
.arow .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
.arow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow time{color:var(--dim);font-size:12.5px;flex:none}
.sec-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec-h h3{font-size:14px;font-weight:600}
.link{color:var(--muted);font-size:13px;margin-left:auto} .link:hover{color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.check{display:flex;flex-direction:column;gap:6px;min-height:168px;transition:border-color .2s}
.check:hover{border-color:var(--line2)}
.check.running{border-color:var(--accent)}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--fg);margin-bottom:6px}
.check h3{font-size:15px;font-weight:600}
.check p{color:var(--muted);font-size:13px}
.check .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:12px;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-CRITICAL{color:var(--crit)} .c-HIGH{color:var(--high)} .c-MEDIUM{color:var(--med)} .c-LOW{color:var(--low)} .c-INFO{color:var(--info)} .c-ok{color:var(--ok)}

.listcard{padding:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:5px 11px;border-radius:8px;color:var(--muted);font-size:13px}
.tab:hover{color:var(--fg)} .tab.sel{background:var(--card2);color:var(--fg)}
.spacer{flex:1}
a.btn{text-decoration:none}
.row{border-bottom:1px solid var(--line)} .row:last-child{border-bottom:0}
.row>button{width:100%;display:grid;grid-template-columns:112px minmax(0,1.3fr) minmax(0,1fr) 16px;gap:12px;align-items:center;padding:11px 16px;transition:background .15s}
.row>button:hover{background:var(--card2)}
.sev{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgt{color:var(--muted);font:12.5px/1.4 "Cascadia Mono",Consolas,ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dim);transition:transform .25s var(--ease)}
.row.open .chev{transform:rotate(90deg)}
.det{display:none;padding:2px 16px 16px 140px;color:var(--muted);font-size:13.5px}
.row.open .det{display:block}
.det h4{color:var(--dim);font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin:10px 0 3px;font-weight:600}
.det pre{white-space:pre-wrap;word-break:break-word;color:var(--fg);font:12.5px/1.5 "Cascadia Mono",Consolas,ui-monospace,monospace}
.det .adv{color:var(--fg)} .det .btn{margin-top:12px}
.note{padding:9px 16px;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line)}
.empty{padding:54px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;font-weight:600;margin-bottom:4px}
.qrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)} .qrow:last-child{border-bottom:0}
.qrow .info{min-width:0;flex:1} .qrow .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .sub{color:var(--muted);font-size:12.5px}

.gcard{display:flex;align-items:center;gap:16px}
.gcard .txt{flex:1} .gcard h3{font-size:15px;font-weight:600} .gcard p{color:var(--muted);font-size:13px;margin-top:2px}
.switch{width:44px;height:25px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch.on{background:var(--accent)} .switch.on::after{transform:translateX(19px)}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lang{padding:8px 15px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);transition:all .15s}
.lang:hover{color:var(--fg);border-color:var(--dim)}
.lang.sel{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.small{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;z-index:5;padding:10px 16px;border-radius:11px;
  background:var(--card2);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.5);transition:all .3s var(--ease);max-width:70vw}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:900px){
  body{overflow:auto}.shell{grid-template-columns:1fr;height:auto}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:2px 8px}.nav{flex-direction:row;flex-wrap:wrap}.side .grow,.ver{display:none}
  .main{height:auto}.cols,.duo{grid-template-columns:1fr}.status{flex-wrap:wrap}.head,.body{padding-left:18px;padding-right:18px}
  .row>button{grid-template-columns:96px minmax(0,1fr) 16px}.tgt{display:none}.det{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    }
    const a = el("div", "card"); a.append(el("h3", null, T.about + " · hexward " + S.version));
    const p = el("p", "small", T.aboutT); p.style.marginTop = "6px"; a.append(p);
    root.append(a);
  }
};

function render() {
  T = I18N[S.lang] || I18N.en;
  document.documentElement.lang = S.lang;
  const all = allFindings(), c = counts(all), nav = $("nav"); nav.replaceChildren();
  for (const p of PAGES) {
    const b = el("button", p === page ? "sel" : ""); b.append(icon(p), el("span", null, T.nav[p]));
    const n = p === "findings" ? all.filter(f => f.severity !== "INFO").length : p === "guard" ? S.alerts.length : 0;
    if (n) b.append(el("span", "badge" + ((p === "findings" && (c.CRITICAL || c.HIGH)) || p === "guard" ? " hot" : ""), String(n)));
    b.onclick = () => go(p); nav.append(b);
  }
  $("gstat").classList.toggle("on", S.watch.on);
  $("gstatText").textContent = S.watch.on ? T.guardOn : T.guardOff;
  $("ver").textContent = "v" + S.version;
  $("title").textContent = T.nav[page]; $("subtitle").textContent = T.sub[page];
  const root = $("page"), fresh = root.dataset.page !== page;
  root.replaceChildren(); root.dataset.page = page;
  root.style.animation = fresh ? "" : "none";
  VIEWS[page](root);
}
async function toggleGuard() { await api("watch", {on: !S.watch.on}); poll(); }
async function loadQ() { Q = (await api("quarantine")).items; if (page === "quarantine") render(); }
async function run(task) {
  if (!S || S.busy) return;
  let path = null;
  if (task === "files" || task === "logs" || task === "ai") {
    if (task === "ai") toast(T.wsHint);
    const p = await api("pick", {kind: task === "logs" ? "file" : "dir"});
    path = p.manual ? prompt(T.pickPath) : p.path;
    if (!path && task !== "ai") return;
  }
  const r = await api("run", {task, path});
  if (!r.ok) toast(T.error + ": " + r.error);
  poll();
}
async function poll() {
  if (stopped) return;
  let s;
  try { s = await api("state?rev=" + lastRev); } catch (e) { return; }  // server gone: the app was closed
  if (!s.runs) return;  // nothing changed since lastRev
  const first = !S; S = s;
  if (!first && s.alerts.length > lastAlerts) { T = I18N[s.lang] || I18N.en; toast(T.alert); page = "guard"; }
  if (!first && lastBusy && !s.busy && !s.error && s.runs[s.task]) {
    T = I18N[s.lang] || I18N.en; toast(tr("done", T.task[s.task], s.runs[s.task].findings.length));
    if (page === "checks") { page = "findings"; tab = s.task; }
  }
  lastRev = s.rev; lastAlerts = s.alerts.length; lastBusy = s.busy;
  render();
}
(function loop() { poll().finally(() => setTimeout(loop, document.hidden ? 3000 : 700)); })();
addEventListener("pagehide", () => navigator.sendBeacon("api/bye"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
