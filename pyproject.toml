[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexward"
version = "0.1.0"
description = "Host security toolkit: log analysis, malware scanning, system audit and AI-agent guard. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "antivirus", "log-analysis", "bruteforce", "nginx", "prompt-injection", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hexward = "hexward.cli:main"

[project.gui-scripts]
hexward-gui = "hexward.gui:main"

[tool.setuptools.package-data]
hexward = ["*.ico", "*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
